<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Tempo Real - Cok League</title>
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" href="favicon.png" type="image/webp">
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f4f4f4; }
  .container { padding:20px; max-width:1200px; margin:auto; }
  h1 { text-align:center; margin-bottom:20px; }
  .placar { display:flex; justify-content: center; align-items:center; gap:50px; margin-bottom:20px; font-size:24px; }
  .estatisticas, .eventos { margin-bottom:30px; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .estatisticas label { display:block; margin:10px 0 5px; }
  .estatisticas input { width:100%; padding:5px; font-size:16px; }
  .botoes-eventos button { margin:5px; padding:10px 15px; font-size:16px; cursor:pointer; border:none; border-radius:4px; }
  .botoes-eventos button.gol { background:green; color:#fff; }
  .botoes-eventos button.cartao-amarelo { background:gold; color:#000; }
  .botoes-eventos button.cartao-vermelho { background:red; color:#fff; }
  .botoes-eventos button.substituicao { background:blue; color:#fff; }
  #lista-eventos { margin-top:15px; max-height:300px; overflow-y:auto; border-top:1px solid #ddd; padding-top:10px; }
  #btn-finalizar { background:#333; color:#fff; padding:10px 20px; font-size:16px; cursor:pointer; border:none; border-radius:5px; }
</style>
</head>
<body>
<div class="container">
  <h1>Painel de Jogo - Tempo Real</h1>

  <!-- Seletor de Jogo -->
  <div class="form-group">
    <label for="select-jogo">Selecionar Confronto:</label>
    <select id="select-jogo">
      <option value="">-- Escolha um jogo --</option>
    </select>
  </div>

  <!-- Placar -->
  <div class="placar">
    <div>
      <strong id="clube-casa">Casa</strong>
      <div style="font-size:48px;" id="gols-casa">0</div>
    </div>
    <div>vs</div>
    <div>
      <strong id="clube-fora">Fora</strong>
      <div style="font-size:48px;" id="gols-fora">0</div>
    </div>
  </div>

  <!-- Estatísticas -->
  <div class="estatisticas">
    <h2>Estatísticas do Jogo</h2>
    <label for="posse-casa">Posse Casa (%)</label>
    <input type="number" id="posse-casa" min="0" max="100">

    <label for="posse-fora">Posse Fora (%)</label>
    <input type="number" id="posse-fora" min="0" max="100">

    <label for="chutes-casa">Chutes Casa</label>
    <input type="number" id="chutes-casa" min="0">

    <label for="chutes-fora">Chutes Fora</label>
    <input type="number" id="chutes-fora" min="0">

    <label for="faltas-casa">Faltas Casa</label>
    <input type="number" id="faltas-casa" min="0">

    <label for="faltas-fora">Faltas Fora</label>
    <input type="number" id="faltas-fora" min="0">

    <label for="escanteios-casa">Escanteios Casa</label>
    <input type="number" id="escanteios-casa" min="0">

    <label for="escanteios-fora">Escanteios Fora</label>
    <input type="number" id="escanteios-fora" min="0">

    <button id="btn-atualizar-estatisticas">Atualizar Estatísticas</button>
  </div>

  <!-- Eventos -->
  <div class="eventos">
    <h2>Eventos do Jogo</h2>
    <div class="botoes-eventos">
      <button class="gol">Gol Casa</button>
      <button class="gol">Gol Fora</button>
      <button class="cartao-amarelo">Cartão Amarelo</button>
      <button class="cartao-vermelho">Cartão Vermelho</button>
      <button class="substituicao">Substituição</button>
    </div>
    <div id="lista-eventos"></div>
  </div>

  <button id="btn-finalizar">Finalizar Jogo</button>
</div>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  doc,
  getDocs,
  updateDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

// Seletores
const selectJogo = document.getElementById("select-jogo");
const clubeCasaEl = document.getElementById("clube-casa");
const clubeForaEl = document.getElementById("clube-fora");
const golsCasaEl = document.getElementById("gols-casa");
const golsForaEl = document.getElementById("gols-fora");
const listaEventos = document.getElementById("lista-eventos");

// Estatísticas
const posseCasaEl = document.getElementById("posse-casa");
const posseForaEl = document.getElementById("posse-fora");
const chutesCasaEl = document.getElementById("chutes-casa");
const chutesForaEl = document.getElementById("chutes-fora");
const faltasCasaEl = document.getElementById("faltas-casa");
const faltasForaEl = document.getElementById("faltas-fora");
const escanteiosCasaEl = document.getElementById("escanteios-casa");
const escanteiosForaEl = document.getElementById("escanteios-fora");
const btnAtualizarEstatisticas = document.getElementById("btn-atualizar-estatisticas");
const btnFinalizar = document.getElementById("btn-finalizar");

// Dados do jogo atual
let jogoAtual = null;
let eventoLista = [];

// Carregar jogos do Firebase
async function carregarJogos() {
  const snap = await getDocs(collection(db, "confrontos"));
  selectJogo.innerHTML = `<option value="">-- Escolha um jogo --</option>`;
  snap.forEach(d => {
    const c = d.data();
    selectJogo.innerHTML += `<option value="${d.id}">${c.casa} vs ${c.fora} (${c.data} ${c.hora})</option>`;
  });
}

// Atualizar display do jogo
function atualizarDisplay() {
  if (!jogoAtual) return;
  clubeCasaEl.textContent = jogoAtual.casa;
  clubeForaEl.textContent = jogoAtual.fora;
  golsCasaEl.textContent = jogoAtual.golos_casa || 0;
  golsForaEl.textContent = jogoAtual.golos_fora || 0;

  posseCasaEl.value = jogoAtual.posse_casa || 0;
  posseForaEl.value = jogoAtual.posse_fora || 0;
  chutesCasaEl.value = jogoAtual.chutes_casa || 0;
  chutesForaEl.value = jogoAtual.chutes_fora || 0;
  faltasCasaEl.value = jogoAtual.faltas_casa || 0;
  faltasForaEl.value = jogoAtual.faltas_fora || 0;
  escanteiosCasaEl.value = jogoAtual.escanteios_casa || 0;
  escanteiosForaEl.value = jogoAtual.escanteios_fora || 0;

  // Lista eventos
  listaEventos.innerHTML = "";
  (eventoLista || []).forEach(ev => {
    const div = document.createElement("div");
    div.textContent = `[${ev.minuto}'] ${ev.tipo} - ${ev.clube}`;
    listaEventos.appendChild(div);
  });
}

// Selecionar jogo
selectJogo.addEventListener("change", async () => {
  const id = selectJogo.value;
  if (!id) return;
  const snap = await getDocs(collection(db, "confrontos"));
  snap.forEach(d => {
    if (d.id === id) {
      jogoAtual = { id: d.id, ...d.data() };
      eventoLista = jogoAtual.eventos || [];
      atualizarDisplay();
    }
  });
});

// Adicionar eventos
document.querySelectorAll(".botoes-eventos button").forEach(btn => {
  btn.addEventListener("click", async () => {
    if (!jogoAtual) return;
    const tipo = btn.textContent;
    const minuto = new Date().getMinutes(); // Pode melhorar com cronómetro real
    let clube = "";
    if (tipo.includes("Casa")) clube = jogoAtual.casa;
    else if (tipo.includes("Fora")) clube = jogoAtual.fora;
    else clube = "-";

    eventoLista.push({ minuto, tipo, clube });
    await updateDoc(doc(db, "confrontos", jogoAtual.id), { eventos: eventoLista });

    // Atualizar gols automaticamente
    if (tipo.includes("Gol")) {
      if (clube === jogoAtual.casa) jogoAtual.golos_casa = (jogoAtual.golos_casa || 0) + 1;
      if (clube === jogoAtual.fora) jogoAtual.golos_fora = (jogoAtual.golos_fora || 0) + 1;
      await updateDoc(doc(db, "confrontos", jogoAtual.id), {
        golos_casa: jogoAtual.golos_casa,
        golos_fora: jogoAtual.golos_fora
      });
    }

    atualizarDisplay();
  });
});

// Atualizar estatísticas
btnAtualizarEstatisticas.addEventListener("click", async () => {
  if (!jogoAtual) return;
  const dados = {
    posse_casa: Number(posseCasaEl.value),
    posse_fora: Number(posseForaEl.value),
    chutes_casa: Number(chutesCasaEl.value),
    chutes_fora: Number(chutesForaEl.value),
    faltas_casa: Number(faltasCasaEl.value),
    faltas_fora: Number(faltasForaEl.value),
    escanteios_casa: Number(escanteiosCasaEl.value),
    escanteios_fora: Number(escanteiosForaEl.value)
  };
  await updateDoc(doc(db, "confrontos", jogoAtual.id), dados);
  jogoAtual = { ...jogoAtual, ...dados };
  atualizarDisplay();
  alert("Estatísticas atualizadas!");
});

// Finalizar jogo
btnFinalizar.addEventListener("click", async () => {
  if (!jogoAtual) return;
  await updateDoc(doc(db, "confrontos", jogoAtual.id), { estado: "terminado" });
  alert("Jogo finalizado!");
  location.reload();
});

// Inicialização
carregarJogos();
</script>
</body>
</html>
